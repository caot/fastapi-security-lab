name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Test with coverage
        env:
          JWT_SECRET: ci-only-secret-please-do-not-use-in-production-123456789
          DB_PATH: ${{ runner.temp }}/security-test.sqlite3
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-report=xml --junitxml=junit.xml
      - name: Concurrency security tests
        run: |
          python -m pytest \
            tests/test_concurrent_refresh.py \
            -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t fastapi-security-lab:${{ github.sha }} .
      - name: Smoke test container
        run: |
          docker run -d --name security-api -p 127.0.0.1:18000:8000 -e JWT_SECRET=ci-only-secret-please-do-not-use-in-production-123456789 fastapi-security-lab:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/health; then exit 0; fi
            sleep 2
          done
          docker logs security-api
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f security-api || true
